appId: com.solowrk.app
productName: SoloWrk
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

# SoloWrk stores everything in the user's chosen workspace folder, so nothing
# user-facing is bundled here — the installer only carries the app itself.
asar: true

# The Agent SDK ships a CLI that is spawned as a child process, and a binary
# inside an asar archive cannot be executed. Unpacking it is what makes the
# assistant work in an installed build rather than only in development.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  # Replace resources/icon.png with real artwork and every Windows size is
  # regenerated from it. `npm run icon` redraws the placeholder.
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user rather than per-machine: no admin prompt to install or update,
  # which is what makes an unattended background update possible at all.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SoloWrk
  # Leave the previous install's files alone on upgrade. The workspace lives in
  # Documents and the config in userData, so neither is touched either way —
  # but a full wipe would drop the pinned taskbar shortcut's target.
  deleteAppDataOnUninstall: false

# Where the app looks for updates, and where `npm run release` publishes them.
# A public repository, so the app carries no credentials: it reads the release
# feed anonymously like any other download.
publish:
  provider: github
  owner: cormstonbusiness-eng
  repo: solowrk
  releaseType: release