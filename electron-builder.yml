appId: com.solowrk.app
productName: SoloWrk
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

# SoloWrk stores everything in the user's chosen workspace folder, so nothing
# user-facing is bundled here — the installer only carries the app itself.
asar: true

# The Agent SDK ships a CLI that is spawned as a child process, and a binary
# inside an asar archive cannot be executed. Unpacking it is what makes the
# assistant work in an installed build rather than only in development.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SoloWrk